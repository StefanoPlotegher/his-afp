<form (submit)="onSubmit()" [formGroup]="ricerca">
  <div class="flex flex-row flex-wrap gap-8 justify-center">
    <p-fieldset legend="Ricerca Paziente" class="w-96">
      <div class="flex flex-col p-4">
        <label for="cf">Codice Fiscale:</label>
        <input
          id="cf"
          formControlName="cf"
          pInputText
          type="text"
          class="w-full"
          [invalid]="checkFormControl('cf')"
        />
        @if (checkFormControl('cf')) {
          @if (checkFormControlError('cf', 'required')) {
            <p-message severity="error" variant="simple">
              Il campo codice fiscale è obbligatorio
            </p-message>
          }
          @if (checkFormControlError('cf', 'pattern')) {
            <p-message severity="error" variant="simple">
              Formato codice fiscale non valido
            </p-message>
          }
        }
      </div>

      
    </p-fieldset>
  </div>

  <div class="flex flex-row gap-4 pt-3 justify-center">
    <p-button label="Cerca" type="submit" />
    <p-button
      label="Reset"
      severity="warn"
      variant="outlined"
      (onClick)="resetForm()"
    />
  </div>
</form>
