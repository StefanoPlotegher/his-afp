<p>Tabella Staff</p>

<p-button 
    (onClick)="newStaff()"
    label="Aggiungi Staff"
/>

<div
class="flex flex-wrap flex-row gap-4 p-4">

@for (st of StaffManager.staff(); track st.id){
    <his-card-staff
        [staff]="st"
    />
}@empty {
    <h1>Nessuno staff presente in lista</h1>
}

</div>
