@if (!editMode()) {
  <div class="mb-4 p-4 cursor-pointer" (click)="startEdit()">
    <p-card
      class="w-2xs border-l-8 {{coloreRuolo(staff().role)}} transition-all"
      [class.opacity-60]="!staff().isActive"
      [class.grayscale]="!staff().isActive"
      [header]="staff().username"
      [subheader]="staff().role"
    >
    </p-card>
  </div>
} @else {
  <div class="mb-4 p-4">
    <p-card
      class="w-2xs border-l-8 {{coloreRuolo(staff().role)}} transition-all"
      [header]="staff().username"
    >
      <ng-template #content>
        <div class="flex flex-col gap-4 p-2">
          <div class="flex flex-col gap-2">
            <label for="role">Ruolo:</label>
            <p-select
              id="role"
              [(ngModel)]="selectedRole"
              [options]="roleOptions"
              optionLabel="desc"
              optionValue="code"
              class="w-full"
              [disabled]="!isActive()"
            />
          </div>
          <div class="flex flex-row items-center gap-3">
            <label for="status">Stato:</label>
            <p-toggleSwitch id="status" [(ngModel)]="isActive" />
            <span>{{ isActive() ? 'Attivo' : 'Disattivo' }}</span>
          </div>
        </div>
      </ng-template>
      <ng-template #footer>
        <div class="flex flex-row gap-2">
          <p-button label="Salva" (onClick)="save()" />
          <p-button
            label="Annulla"
            severity="warn"
            variant="outlined"
            (onClick)="cancel()"
          />
        </div>
      </ng-template>
    </p-card>
  </div>
}
