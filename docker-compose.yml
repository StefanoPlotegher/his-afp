#version: "3.8"

services:
  db:
    image: postgres:15-alpine
    container_name: sio-postgres
    environment:
      POSTGRES_USER: sio_user
      POSTGRES_PASSWORD: sio_password
      POSTGRES_DB: sio_db
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - backend-net

  backend-blue:
    build: ./backend
    container_name: sio-backend-blue
    environment:
      DB_HOST: db
      DB_USER: sio_user
      DB_PASS: sio_password
      DB_NAME: sio_db
      JWT_SECRET: "chiave_segreta_super_sicura_per_il_corso_segretissimissima"
      AUTH_ENABLED: "false"
    depends_on:
      - db
    restart: always
    networks:
      - backend-net

  backend-green:
    build: ./backend
    container_name: sio-backend-green
    environment:
      DB_HOST: db
      DB_USER: sio_user
      DB_PASS: sio_password
      DB_NAME: sio_db
      JWT_SECRET: "chiave_segreta_super_sicura_per_il_corso_segretissimissima"
      AUTH_ENABLED: "false"
    depends_on:
      - db
    restart: always
    networks:
      - backend-net

  fe-sio:
    build:
      context: ./his-afp-frontend
      dockerfile: Dockerfile
    image: his-afp-frontend:${SVI_VERSION:-latest}
    container_name: fe-sio
    environment:
      APP_ENV: "SVI"
      APP_VERSION: "${SVI_VERSION}"
    networks:
      - frontend-net

  fe-prod:
    build:
      context: ./his-afp-frontend
      dockerfile: Dockerfile
    image: his-afp-frontend:${PROD_VERSION:-latest}
    container_name: fe-prod
    environment:
      APP_ENV: "PROD"
      APP_VERSION: "${PROD_VERSION}"
    networks:
      - frontend-net

  fe-test:
    build:
      context: ./his-afp-frontend
      dockerfile: Dockerfile
    image: his-afp-frontend:${TEST_VERSION:-latest}
    container_name: fe-test
    environment:
      APP_ENV: "TEST"
      APP_VERSION: "${TEST_VERSION}"
    networks:
      - frontend-net

  gateway:
    image: nginx:alpine
    container_name: sio-gateway
    ports:
      - "80:80"
      - "8999:8999"
      - "8080:8080"
    volumes:
      - ./gateway:/etc/nginx/conf.d/:ro
    depends_on:
      - fe-sio
      - fe-prod
      - fe-test
    restart: always
    networks:
      - frontend-net
      - backend-net


volumes:
  pg_data:

networks:
  frontend-net:
    driver: bridge

  backend-net:
    driver: bridge
    internal: true
